<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosty Czat Szkoły Językowej</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .chat-container { height: 100vh; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; background: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="p-4 bg-blue-600 text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="font-bold text-lg">Czat Szkoły Językowej</h1>
                <div class="text-[10px] opacity-80 flex items-center gap-1">
                    <span id="status-dot" class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                    Sesja: <span id="session-id-display">Generowanie...</span>
                </div>
            </div>
            <button onclick="clearChat()" class="text-xs bg-blue-700 px-2 py-1 rounded hover:bg-blue-800 transition-colors">Wyczyść</button>
        </div>

        <!-- Obszar wiadomości -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 messages-area bg-slate-50">
            <div class="flex justify-start">
                <div class="bg-white border border-slate-200 text-slate-800 p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] text-sm">
                    Dzień dobry! W czym możemy pomóc? Napisz do nas.
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="p-4 border-t border-slate-100 bg-white">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Wpisz wiadomość..." 
                    class="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
                <button 
                    onclick="sendMessage()" 
                    id="send-button"
                    class="bg-blue-600 text-white px-5 py-3 rounded-xl hover:bg-blue-700 transition-all active:scale-95 disabled:opacity-50"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const webhookUrl = 'https://n8n.srv1319103.hstgr.cloud/webhook/1e972992-d043-4474-861c-98ed52e3bfb4';
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const sessionDisplay = document.getElementById('session-id-display');

        // Obsługa SessionID
        let sessionId = localStorage.getItem('school_chat_session_id');
        if (!sessionId) {
            sessionId = 'lang_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('school_chat_session_id', sessionId);
        }
        sessionDisplay.innerText = sessionId;

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Zablokuj input i pokaż wiadomość użytkownika
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;
            
            appendMessage('user', message);
            
            // Wskaźnik ładowania
            const loadingId = appendMessage('bot', '<div class="flex gap-1 py-1"><div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div><div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay:0.2s"></div><div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay:0.4s"></div></div>');

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chatInput: message, 
                        message: message,   
                        sessionId: sessionId,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }

                const data = await response.json();
                removeMessage(loadingId);

                // Próba inteligentnego znalezienia tekstu w odpowiedzi
                let botText = "";
                
                if (typeof data === 'string') {
                    botText = data;
                } else if (Array.isArray(data) && data.length > 0) {
                    botText = data[0].output || data[0].message || data[0].text || JSON.stringify(data[0]);
                } else {
                    botText = data.output || data.message || data.text || data.response || JSON.stringify(data);
                }

                appendMessage('bot', botText);

            } catch (error) {
                console.error('Błąd połączenia:', error);
                removeMessage(loadingId);
                appendMessage('bot', `<span class="text-red-500 font-medium">Podano błędne lub brak hasła, jeżeli nie skontaktuj się bezpośrednio z właścicielem.</span>`);
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(sender, text) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300`;
            
            const color = sender === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none';
            
            div.innerHTML = `
                <div class="${color} p-3 rounded-2xl shadow-sm max-w-[85%] text-sm leading-relaxed">
                    ${text}
                </div>
            `;
            
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            appendMessage('bot', 'Czat został wyczyszczony. W czym mogę pomóc?');
        }
    </script>
</body>
</html>
